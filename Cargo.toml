[package]
name = "mcp-ssh"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
rust-ini = "0.21"
rusqlite = { version = "0.31.0", features = ["bundled"] }
directories = "5.0"
clap = { version = "4.4", features = ["derive"] }
ssh2 = "0.9"
keyring = "3.2"
aes-gcm = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
